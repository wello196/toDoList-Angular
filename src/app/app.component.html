<app-header/>
<main>
  <ul id="users">
    @for(user of userData.DUMMY_USERS; track user.id){
      <li>
      <app-user [selected]="user.id===userData.selectedUser?.id" [user]="user"  ></app-user>
    </li>
    }
    
  </ul>
@if (userData.selectedUser) {
  <app-task [userId]="userData.selectedUser.id" [name]="userData.selectedUser.name"/>
}
@else {
  <p id="fallback">Please select a user to see their tasks!</p>
}
</main>
